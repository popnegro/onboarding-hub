name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/vercel-build-supabase-types

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Install isolated PostgreSQL test runtime
        run: npm install --no-save --package-lock=false @electric-sql/pglite@0.5.14
      - name: Verify Python automation contract
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate n8n workflow export
        run: python -m json.tool automation/n8n/wf-00-event-contract-validation.json > /dev/null
      - name: Verify
        run: npm run build
